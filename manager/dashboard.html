<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Parshd Manager Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #172033;
        }


        /* =========================================
           HEADER
        ========================================= */

        .topbar {

            background: #ffffff;

            border-bottom:
                1px solid #e5e9f0;

            min-height: 70px;

            padding:
                0 24px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            position: sticky;

            top: 0;

            z-index: 10;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .brand-icon {

            width: 43px;
            height: 43px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #1769e0;

            color: #ffffff;

            font-size: 20px;

            font-weight: 800;
        }


        .brand-text strong {

            display: block;

            font-size: 17px;
        }


        .brand-text span {

            display: block;

            margin-top: 2px;

            color: #7a8495;

            font-size: 12px;
        }


        #logoutButton {

            border: 0;

            background: #fff1f1;

            color: #b42318;

            padding:
                10px 16px;

            border-radius: 9px;

            font-weight: 700;

            cursor: pointer;
        }


        /* =========================================
           MAIN
        ========================================= */

        .container {

            width: 100%;

            max-width: 1200px;

            margin: auto;

            padding: 28px 20px 50px;
        }


        .welcome {

            margin-bottom: 25px;
        }


        .welcome h1 {

            margin: 0;

            font-size: 28px;
        }


        .welcome p {

            margin:
                7px 0 0;

            color: #737d8e;

            font-size: 14px;
        }


        /* =========================================
           STATS
        ========================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 16px;

            margin-bottom: 28px;
        }


        .stat-card {

            background: #ffffff;

            border:
                1px solid #e6eaf0;

            border-radius: 15px;

            padding: 20px;
        }


        .stat-label {

            color: #727c8e;

            font-size: 13px;
        }


        .stat-number {

            margin-top: 9px;

            font-size: 29px;

            font-weight: 800;
        }


        .pending-number {
            color: #d97706;
        }


        .approved-number {
            color: #16803c;
        }


        .rejected-number {
            color: #c62828;
        }


        /* =========================================
           SECTION
        ========================================= */

        .section {

            background: #ffffff;

            border:
                1px solid #e6eaf0;

            border-radius: 16px;

            overflow: hidden;

            margin-bottom: 22px;
        }


        .section-header {

            padding:
                18px 20px;

            border-bottom:
                1px solid #e8ecf2;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }


        .section-header h2 {

            margin: 0;

            font-size: 18px;
        }


        .section-header span {

            color: #737d8e;

            font-size: 13px;
        }


        .empty {

            padding: 35px 20px;

            text-align: center;

            color: #7b8493;

            font-size: 14px;
        }


        /* =========================================
           TABLE
        ========================================= */

        .table-wrap {

            width: 100%;

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 800px;
        }


        th,
        td {

            padding:
                14px 16px;

            text-align: left;

            border-bottom:
                1px solid #edf0f4;

            font-size: 14px;
        }


        th {

            background: #fafbfc;

            color: #687386;

            font-size: 12px;

            text-transform: uppercase;
        }


        tr:last-child td {

            border-bottom: 0;
        }


        .status {

            display: inline-block;

            padding:
                5px 9px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }


        .status.pending {

            background: #fff5df;

            color: #a35c00;
        }


        .status.approved {

            background: #eaf8ef;

            color: #16743a;
        }


        .status.rejected {

            background: #fff0f0;

            color: #b42318;
        }


        .actions {

            display: flex;

            gap: 7px;
        }


        .action-btn {

            border: 0;

            padding:
                8px 11px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;
        }


        .approve-btn {

            background: #eaf8ef;

            color: #16743a;
        }


        .reject-btn {

            background: #fff0f0;

            color: #b42318;
        }


        .view-btn {

            background: #eef4ff;

            color: #1769e0;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            padding: 35px;

            text-align: center;

            color: #687386;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 850px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 520px) {

            .topbar {

                padding:
                    0 15px;
            }


            .container {

                padding:
                    22px 14px 40px;
            }


            .brand-text span {

                display: none;
            }


            .welcome h1 {

                font-size: 24px;
            }


            .stats {

                grid-template-columns:
                    1fr 1fr;

                gap: 10px;
            }


            .stat-card {

                padding: 15px;
            }


            .stat-number {

                font-size: 24px;
            }


            #logoutButton {

                padding:
                    9px 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="topbar">


        <div class="brand">

            <div class="brand-icon">
                P
            </div>


            <div class="brand-text">

                <strong>
                    Parshd Manager
                </strong>

                <span>
                    Master Control Panel
                </span>

            </div>

        </div>


        <button
            id="logoutButton"
            type="button"
        >
            Logout
        </button>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="container">


        <div class="welcome">

            <h1>
                Manager Dashboard
            </h1>

            <p>
                Parshad registrations और approvals manage करें।
            </p>

        </div>


        <!-- =====================================
             STATS
        ====================================== -->

        <section class="stats">


            <div class="stat-card">

                <div class="stat-label">
                    Total Parshads
                </div>

                <div
                    id="totalCount"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Pending Approval
                </div>

                <div
                    id="pendingCount"
                    class="stat-number pending-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Approved
                </div>

                <div
                    id="approvedCount"
                    class="stat-number approved-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Rejected
                </div>

                <div
                    id="rejectedCount"
                    class="stat-number rejected-number"
                >
                    0
                </div>

            </div>


        </section>


        <!-- =====================================
             PENDING
        ====================================== -->

        <section class="section">


            <div class="section-header">

                <h2>
                    Pending Registrations
                </h2>

                <span id="pendingLabel">
                    0 requests
                </span>

            </div>


            <div id="pendingContent">

                <div class="loading">
                    Loading...
                </div>

            </div>


        </section>


        <!-- =====================================
             APPROVED
        ====================================== -->

        <section class="section">


            <div class="section-header">

                <h2>
                    Approved Parshads
                </h2>

                <span id="approvedLabel">
                    0 parshads
                </span>

            </div>


            <div id="approvedContent">

                <div class="loading">
                    Loading...
                </div>

            </div>


        </section>


        <!-- =====================================
             REJECTED
        ====================================== -->

        <section class="section">


            <div class="section-header">

                <h2>
                    Rejected Registrations
                </h2>

                <span id="rejectedLabel">
                    0 requests
                </span>

            </div>


            <div id="rejectedContent">

                <div class="loading">
                    Loading...
                </div>

            </div>


        </section>


    </main>


    <script
        type="module"
        src="./dashboard.js"
    ></script>


</body>

</html>

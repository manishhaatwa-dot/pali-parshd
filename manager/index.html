<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Parshd Manager Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #f8fbff
                );

            color: #172033;
        }


        .login-box {

            width: 100%;
            max-width: 430px;

            background: #ffffff;

            border-radius: 22px;

            padding: 32px;

            box-shadow:
                0 15px 45px
                rgba(20, 50, 100, 0.12);
        }


        .logo {

            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1769e0;

            color: #ffffff;

            font-size: 30px;
            font-weight: 800;
        }


        h1 {

            margin: 0;

            text-align: center;

            font-size: 27px;
        }


        .subtitle {

            margin: 8px 0 28px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
        }


        label {

            display: block;

            margin: 17px 0 7px;

            font-size: 14px;

            font-weight: 700;
        }


        .input-wrap {

            position: relative;
        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #d8dee9;

            border-radius: 11px;

            outline: none;

            font-size: 15px;

            background: #ffffff;
        }


        input:focus {

            border-color: #1769e0;

            box-shadow:
                0 0 0 3px
                rgba(23, 105, 224, 0.10);
        }


        #togglePassword {

            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            cursor: pointer;

            font-size: 18px;
        }


        #loginButton {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: 0;

            border-radius: 11px;

            background: #1769e0;

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }


        #loginButton:hover {

            background: #0f58c2;
        }


        #loginButton:disabled {

            opacity: 0.65;

            cursor: not-allowed;
        }


        .login-message {

            display: none;

            margin-top: 17px;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.5;
        }


        .login-message.show {

            display: block;
        }


        .login-message.error {

            background: #fff0f0;

            color: #b42318;
        }


        .login-message.success {

            background: #eaf8ef;

            color: #14753b;
        }


        .footer {

            margin-top: 25px;

            text-align: center;

            color: #8a94a6;

            font-size: 12px;
        }

    </style>

</head>


<body>


    <main class="login-box">


        <div class="logo">
            P
        </div>


        <h1>
            Parshd Manager
        </h1>


        <div class="subtitle">
            Master Manager Login
        </div>


        <form id="loginForm">


            <label for="email">
                Manager Email
            </label>

            <input
                id="email"
                type="email"
                autocomplete="username"
                placeholder="Manager email"
                required
            >


            <label for="password">
                Password
            </label>


            <div class="input-wrap">

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    aria-label="Show password"
                >
                    👁
                </button>

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Manager Login
            </button>


        </form>


        <div
            id="loginMessage"
            class="login-message"
        ></div>


        <div class="footer">
            Parshd.in • Manager Panel
        </div>


    </main>


    <script type="module" src="./login.js"></script>

</body>

</html>

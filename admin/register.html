<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Create Parshad Account | Parshd</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #111827;
        }

        .page {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px 15px;
        }

        .box {
            width: 100%;
            max-width: 470px;

            padding: 28px 24px;

            border: 1px solid #e5e7eb;
            border-radius: 18px;

            background: #ffffff;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 68px;
            height: 68px;

            object-fit: contain;

            border-radius: 16px;

            margin-bottom: 12px;
        }

        h1 {
            margin: 0;

            font-size: 25px;
            line-height: 1.3;
        }

        .subtitle {
            margin: 7px 0 0;

            color: #6b7280;

            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;

            color: #374151;
        }

        input {
            width: 100%;
            height: 49px;

            padding: 0 13px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            outline: none;

            background: #ffffff;

            color: #111827;

            font-size: 16px;
        }

        input:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 3px
                rgba(17, 24, 39, 0.08);
        }

        .button {
            width: 100%;
            min-height: 50px;

            margin-top: 5px;

            border: 0;
            border-radius: 10px;

            background: #111827;
            color: #ffffff;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 13px;

            border-radius: 9px;

            text-align: center;

            font-size: 14px;

            line-height: 1.55;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .message.success {
            background: #f0fdf4;
            color: #15803d;
        }

        .approval-box {
            display: none;

            margin-top: 16px;

            padding: 15px;

            border-radius: 12px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            text-align: center;

            font-size: 14px;

            line-height: 1.6;
        }

        .approval-box.show {
            display: block;
        }

        .approval-title {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .whatsapp-button {
            display: inline-block;

            margin-top: 10px;

            padding: 11px 16px;

            border-radius: 9px;

            background: #16a34a;

            color: #ffffff;

            text-decoration: none;

            font-weight: 700;
        }

        .login-link {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #374151;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;
        }

        @media (max-width: 480px) {

            .page {
                padding: 15px 12px;
                align-items: flex-start;
            }

            .box {
                margin-top: 10px;
                padding: 24px 18px;
                border-radius: 16px;
            }

            h1 {
                font-size: 23px;
            }
        }

    </style>

</head>


<body>


<main class="page">

    <section class="box">


        <header class="header">

            <img
                src="../assets/icons/icon-192.png"
                alt="Parshd"
                class="logo"
            >

            <h1>
                Create Parshad Account
            </h1>

            <p class="subtitle">
                अपना Parshad account registration करें
            </p>

        </header>


        <form id="registerForm">


            <div class="form-group">

                <label for="name">
                    Parshad Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter full name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="10 digit mobile number"
                    inputmode="numeric"
                    maxlength="10"
                    required
                >

            </div>


            <div class="form-group">

                <label for="ward">
                    Ward Number
                </label>

                <input
                    type="text"
                    id="ward"
                    placeholder="Example: 44"
                    inputmode="numeric"
                    required
                >

            </div>


            <div class="form-group">

                <label for="area">
                    Area / Ward Name
                </label>

                <input
                    type="text"
                    id="area"
                    placeholder="Enter area name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                id="createButton"
                class="button"
            >
                Submit Registration
            </button>


            <div
                id="message"
                class="message"
            ></div>


            <div
                id="approvalBox"
                class="approval-box"
            >

                <div class="approval-title">
                    Registration Pending Approval
                </div>

                आपका registration submit हो गया है।
                <br>

                Account activate होने के लिए
                Manager approval जरूरी है।

                <br>

                नीचे WhatsApp से approval के लिए
                संपर्क करें।

                <br>

                <a
                    id="whatsappButton"
                    class="whatsapp-button"
                    target="_blank"
                    rel="noopener"
                >
                    WhatsApp पर संपर्क करें
                </a>

            </div>


        </form>


        <a
            href="./index.html"
            class="login-link"
        >
            Already have an account? Login
        </a>


    </section>

</main>


<script type="module">

    import {
        createUserWithEmailAndPassword,
        signOut
    } from
        "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


    import {
        doc,
        setDoc,
        serverTimestamp
    } from
        "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


    import {
        auth,
        db
    } from "../js/firebase-config.js";


    // =================================================
    // ELEMENTS
    // =================================================

    const form =
        document.getElementById(
            "registerForm"
        );

    const message =
        document.getElementById(
            "message"
        );

    const approvalBox =
        document.getElementById(
            "approvalBox"
        );

    const whatsappButton =
        document.getElementById(
            "whatsappButton"
        );

    const createButton =
        document.getElementById(
            "createButton"
        );


    // =================================================
    // YOUR APPROVAL CONTACT
    // =================================================
    //
    // IMPORTANT:
    // Yahan baad me tumhara actual WhatsApp
    // number डालेंगे.
    //
    // Abhi placeholder hai.
    //
    // =================================================

    const MANAGER_WHATSAPP =
        "91XXXXXXXXXX";


    // =================================================
    // MESSAGE
    // =================================================

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            `message show ${type}`;
    }


    // =================================================
    // FORM
    // =================================================

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const mobile =
                document
                    .getElementById("mobile")
                    .value
                    .trim();


            const ward =
                document
                    .getElementById("ward")
                    .value
                    .trim();


            const area =
                document
                    .getElementById("area")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            // =========================================
            // VALIDATION
            // =========================================

            if (
                !name ||
                !email ||
                !mobile ||
                !ward ||
                !area ||
                !password
            ) {

                showMessage(
                    "सभी details भरें।",
                    "error"
                );

                return;
            }


            if (
                !/^\d{10}$/.test(
                    mobile
                )
            ) {

                showMessage(
                    "Mobile number 10 digit का होना चाहिए।",
                    "error"
                );

                return;
            }


            if (
                !/^\d+$/.test(
                    ward
                )
            ) {

                showMessage(
                    "Ward number सही भरें।",
                    "error"
                );

                return;
            }


            if (
                password.length < 6
            ) {

                showMessage(
                    "Password कम से कम 6 characters का रखें।",
                    "error"
                );

                return;
            }


            // =========================================
            // BUTTON
            // =========================================

            createButton.disabled =
                true;

            createButton.textContent =
                "Submitting...";


            try {

                // =====================================
                // CREATE FIREBASE AUTH USER
                // =====================================

                const credential =
                    await
                    createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                const uid =
                    user.uid;


                // =====================================
                // FIRESTORE PARSHAD DOCUMENT
                // =====================================

                const parshadRef =
                    doc(
                        db,
                        "parshd",
                        "parshads",
                        "data",
                        uid
                    );


                await setDoc(
                    parshadRef,
                    {

                        parshadId:
                            uid,

                        name:
                            name,

                        email:
                            email,

                        mobile:
                            mobile,

                        ward:
                            ward,

                        area:
                            area,

                        status:
                            "pending",

                        approved:
                            false,

                        complaintEnabled:
                            true,

                        createdAt:
                            serverTimestamp(),

                        approvedAt:
                            null,

                        rejectedAt:
                            null

                    }
                );


                // =====================================
                // SIGN OUT
                // =====================================
                //
                // IMPORTANT:
                // Registration ke baad automatically
                // login nahi hoga.
                //
                // =====================================

                await signOut(auth);


                // =====================================
                // SUCCESS UI
                // =====================================

                showMessage(
                    "Registration successfully submit हो गया है।",
                    "success"
                );


                approvalBox
                    .classList
                    .add("show");


                // =====================================
                // WHATSAPP MESSAGE
                // =====================================

                const whatsappText =
                    `Hello, मैंने Parshad registration किया है.%0A%0A` +
                    `Name: ${encodeURIComponent(name)}%0A` +
                    `Ward: ${encodeURIComponent(ward)}%0A` +
                    `Area: ${encodeURIComponent(area)}%0A` +
                    `Email: ${encodeURIComponent(email)}%0A%0A` +
                    `Please approve my Parshd account.`;


                whatsappButton.href =
                    `https://wa.me/${MANAGER_WHATSAPP}?text=${whatsappText}`;


                // =====================================
                // DISABLE FORM
                // =====================================

                createButton.textContent =
                    "Registration Submitted";


                createButton.disabled =
                    true;


            } catch (error) {

                console.error(
                    "Parshad registration error:",
                    error
                );


                let errorMessage =
                    "Registration नहीं हो सका।";


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    errorMessage =
                        "इस email से account पहले से registered है।";

                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "Email सही नहीं है।";

                } else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    errorMessage =
                        "Password कम से कम 6 characters का रखें।";

                } else if (
                    error.code ===
                    "permission-denied"
                ) {

                    errorMessage =
                        "Registration save करने की permission नहीं मिली।";
                }


                showMessage(
                    errorMessage,
                    "error"
                );


                createButton.disabled =
                    false;

                createButton.textContent =
                    "Submit Registration";


                // -------------------------------------
                // IMPORTANT:
                // अगर Auth user बन गया लेकिन Firestore
                // save नहीं हुआ तो current session हटाएँ.
                // -------------------------------------

                try {

                    await signOut(auth);

                } catch (_) {}

            }

        }
    );

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Complaints | Parshd</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      background: #2563eb;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .top-info {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .top-info strong {
      color: #2563eb;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .filter-btn {
      border: 0;
      padding: 10px 15px;
      border-radius: 8px;
      background: #e5e7eb;
      cursor: pointer;
      font-weight: 600;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
    }

    .complaint-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 12px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .complaint-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .complaint-id {
      font-weight: bold;
      color: #2563eb;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-new {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-solved {
      background: #dcfce7;
      color: #166534;
    }

    .complaint-info {
      margin-top: 10px;
      line-height: 1.6;
    }

    .complaint-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      font-family: inherit;
    }

    .btn {
      border: 0;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-details {
      background: #2563eb;
      color: white;
    }

    .btn-pending {
      background: #f59e0b;
      color: white;
    }

    .btn-solved {
      background: #16a34a;
      color: white;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .empty {
      background: white;
      padding: 35px 20px;
      text-align: center;
      border-radius: 12px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 720px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 20px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      right: 15px;
      top: 12px;
      border: 0;
      background: #ef4444;
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .modal-title {
      margin: 0 45px 15px 0;
    }

    .detail-row {
      padding: 9px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-row strong {
      display: inline-block;
      min-width: 120px;
    }

    .media-section {
      margin-top: 20px;
    }

    .media-section h3 {
      margin-bottom: 10px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .image-grid img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .video-box video {
      width: 100%;
      max-height: 400px;
      border-radius: 10px;
      background: #000;
    }

    .download-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 12px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-size: 13px;
    }

    .map-link {
      display: inline-block;
      margin-top: 5px;
      color: #2563eb;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      header {
        padding: 13px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 0 10px;
      }

      .complaint-card {
        padding: 13px;
      }

      .complaint-actions .btn {
        width: 100%;
      }

      .detail-row strong {
        display: block;
        margin-bottom: 3px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Complaints</h1>
  <a href="./dashboard.html" class="back-btn">← Dashboard</a>
</header>

<div class="container">

  <div class="top-info" id="accountInfo">
    Loading...
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="new">New</button>
    <button class="filter-btn" data-filter="pending">Pending</button>
    <button class="filter-btn" data-filter="solved">Solved</button>
  </div>

  <div id="complaintsContainer">
    <div class="loading">Complaints load ho rahi hain...</div>
  </div>

</div>


<!-- DETAILS MODAL -->

<div class="modal" id="detailsModal">

  <div class="modal-box">

    <button class="modal-close" id="closeModal">×</button>

    <h2 class="modal-title">Complaint Details</h2>

    <div id="detailsContent"></div>

  </div>

</div>


<script type="module">

  import {
    auth,
    db,
    storage
  } from "../js/firebase-config.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  import {
    collection,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  import {
    ref,
    deleteObject
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";


  const complaintsContainer =
    document.getElementById("complaintsContainer");

  const accountInfo =
    document.getElementById("accountInfo");

  const detailsModal =
    document.getElementById("detailsModal");

  const detailsContent =
    document.getElementById("detailsContent");

  const closeModal =
    document.getElementById("closeModal");


  let currentUser = null;
  let currentAccount = null;
  let complaints = [];
  let currentFilter = "all";


  /* =========================================================
     AUTH
  ========================================================= */

  onAuthStateChanged(auth, async (user) => {

    if (!user) {
      window.location.href = "./index.html";
      return;
    }

    currentUser = user;

    try {

      await loadAccount();
      await loadComplaints();

    } catch (error) {

      console.error(error);

      complaintsContainer.innerHTML = `
        <div class="empty">
          Data load nahi ho paya.<br>
          ${escapeHtml(error.message || "")}
        </div>
      `;

    }

  });


  /* =========================================================
     LOAD PARSHAD ACCOUNT
  ========================================================= */

  async function loadAccount() {

    const accountRef =
      doc(db, "parshd", "parshads", "data", currentUser.uid);

    const accountSnap =
      await getDoc(accountRef);

    if (!accountSnap.exists()) {
      throw new Error("Parshad account nahi mila.");
    }

    currentAccount = {
      id: accountSnap.id,
      ...accountSnap.data()
    };


    if (
      currentAccount.status !== "approved" ||
      currentAccount.approved !== true
    ) {

      throw new Error(
        "Aapka Parshad account approved nahi hai."
      );

    }


    accountInfo.innerHTML = `
      <div>
        <strong>${escapeHtml(currentAccount.name || "Parshad")}</strong>
      </div>

      <div>
        Ward:
        <strong>${escapeHtml(String(currentAccount.ward || ""))}</strong>
      </div>

      <div>
        Complaints:
        <strong>
          ${
            currentAccount.complaintEnabled === false
              ? "OFF"
              : "ON"
          }
        </strong>
      </div>
    `;

  }


  /* =========================================================
     LOAD COMPLAINTS
  ========================================================= */

  async function loadComplaints() {

    complaintsContainer.innerHTML = `
      <div class="loading">
        Complaints load ho rahi hain...
      </div>
    `;


    const complaintsRef =
      collection(db, "parshd", "complaints", "data");

    const snapshot =
      await getDocs(complaintsRef);


    complaints = [];


    snapshot.forEach((item) => {

      const data = item.data();

      /*
       * IMPORTANT:
       * Sirf current logged-in Parshad ki complaints.
       */

      if (
        data.parshadId !== currentUser.uid
      ) {
        return;
      }


      /*
       * Ward bhi match hona chahiye.
       */

      if (
        String(data.wardNumber || "") !==
        String(currentAccount.ward || "")
      ) {
        return;
      }


      complaints.push({
        id: item.id,
        ...data
      });

    });


    complaints.sort((a, b) => {

      const aTime =
        a.createdAt?.seconds || 0;

      const bTime =
        b.createdAt?.seconds || 0;

      return bTime - aTime;

    });


    renderComplaints();

  }


  /* =========================================================
     FILTER BUTTONS
  ========================================================= */

  document.querySelectorAll(".filter-btn")
    .forEach(button => {

      button.addEventListener("click", () => {

        document.querySelectorAll(".filter-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        button.classList.add("active");

        currentFilter =
          button.dataset.filter;

        renderComplaints();

      });

    });


  /* =========================================================
     RENDER COMPLAINTS
  ========================================================= */

  function renderComplaints() {

    let list = [...complaints];


    if (currentFilter !== "all") {

      list =
        list.filter(
          complaint =>
            complaint.status === currentFilter
        );

    }


    if (list.length === 0) {

      complaintsContainer.innerHTML = `
        <div class="empty">
          Is category me koi complaint nahi hai.
        </div>
      `;

      return;

    }


    complaintsContainer.innerHTML =
      list.map(renderComplaintCard).join("");


    document
      .querySelectorAll("[data-details]")
      .forEach(button => {

        button.addEventListener("click", () => {

          const id =
            button.dataset.details;

          const complaint =
            complaints.find(
              item => item.id === id
            );

          if (complaint) {
            showDetails(complaint);
          }

        });

      });


    document
      .querySelectorAll("[data-pending]")
      .forEach(button => {

        button.addEventListener("click", () => {

          const id =
            button.dataset.pending;

          updateStatus(id, "pending");

        });

      });


    document
      .querySelectorAll("[data-solved]")
      .forEach(button => {

        button.addEventListener("click", () => {

          const id =
            button.dataset.solved;

          updateStatus(id, "solved");

        });

      });

  }


  /* =========================================================
     COMPLAINT CARD
  ========================================================= */

  function renderComplaintCard(complaint) {

    const status =
      complaint.status || "new";


    const createdDate =
      formatDate(complaint.createdAt);


    return `
      <div class="complaint-card">

        <div class="complaint-top">

          <div class="complaint-id">
            Complaint ID:
            ${escapeHtml(
              complaint.publicComplaintId ||
              complaint.complaintId ||
              complaint.id
            )}
          </div>

          <div class="status status-${status}">
            ${escapeHtml(status)}
          </div>

        </div>


        <div class="complaint-info">

          <div>
            <strong>Name:</strong>
            ${escapeHtml(
              complaint.citizenName || "-"
            )}
          </div>

          <div>
            <strong>Mobile:</strong>
            ${escapeHtml(
              complaint.citizenPhone || "-"
            )}
          </div>

          <div>
            <strong>Ward:</strong>
            ${escapeHtml(
              String(complaint.wardNumber || "-")
            )}
          </div>

          <div>
            <strong>Date:</strong>
            ${escapeHtml(createdDate)}
          </div>

        </div>


        <div class="complaint-actions">

          <button
            class="btn btn-details"
            data-details="${escapeHtml(complaint.id)}">
            Details
          </button>


          ${
            status === "new"
              ? `
                <button
                  class="btn btn-pending"
                  data-pending="${escapeHtml(complaint.id)}">
                  Mark Pending
                </button>
              `
              : ""
          }


          ${
            status !== "solved"
              ? `
                <button
                  class="btn btn-solved"
                  data-solved="${escapeHtml(complaint.id)}">
                  Mark Solved
                </button>
              `
              : ""
          }

        </div>

      </div>
    `;

  }


  /* =========================================================
     SHOW DETAILS
  ========================================================= */

  function showDetails(complaint) {

    const media =
      complaint.media || {};

    const images =
      Array.isArray(media.images)
        ? media.images
        : [];

    const video =
      media.video || null;


    let html = `

      <div class="detail-row">
        <strong>Complaint ID:</strong>
        ${escapeHtml(
          complaint.publicComplaintId ||
          complaint.complaintId ||
          complaint.id
        )}
      </div>


      <div class="detail-row">
        <strong>Status:</strong>
        ${escapeHtml(
          complaint.status || "-"
        )}
      </div>


      <div class="detail-row">
        <strong>Name:</strong>
        ${escapeHtml(
          complaint.citizenName || "-"
        )}
      </div>


      <div class="detail-row">
        <strong>Mobile:</strong>
        ${escapeHtml(
          complaint.citizenPhone || "-"
        )}
      </div>


      <div class="detail-row">
        <strong>Ward:</strong>
        ${escapeHtml(
          String(complaint.wardNumber || "-")
        )}
      </div>


      <div class="detail-row">
        <strong>Address:</strong>
        ${escapeHtml(
          complaint.address || "-"
        )}
      </div>


      <div class="detail-row">
        <strong>Complaint:</strong>
        ${escapeHtml(
          complaint.complaintText || "-"
        )}
      </div>


      <div class="detail-row">
        <strong>Date:</strong>
        ${escapeHtml(
          formatDate(complaint.createdAt)
        )}
      </div>

    `;


    if (complaint.solvedAt) {

      html += `
        <div class="detail-row">
          <strong>Solved Date:</strong>
          ${escapeHtml(
            formatDate(complaint.solvedAt)
          )}
        </div>
      `;

    }


    /* =======================================================
       GPS
    ======================================================= */

    if (
      complaint.location &&
      typeof complaint.location.latitude === "number" &&
      typeof complaint.location.longitude === "number"
    ) {

      const lat =
        complaint.location.latitude;

      const lng =
        complaint.location.longitude;


      html += `
        <div class="detail-row">

          <strong>GPS:</strong>

          <a
            class="map-link"
            href="https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}"
            target="_blank"
            rel="noopener">
            📍 Open Location
          </a>

        </div>
      `;

    }


    /* =======================================================
       MEDIA
    ======================================================= */

    if (images.length > 0 || video) {

      html += `
        <div class="media-section">
          <h3>Complaint Media</h3>
      `;


      if (images.length > 0) {

        html += `
          <div class="image-grid">
        `;


        images.forEach(image => {

          if (!image?.url) return;

          html += `
            <div>

              <img
                src="${escapeAttribute(image.url)}"
                alt="Complaint image">

              <br>

              <a
                class="download-btn"
                href="${escapeAttribute(image.url)}"
                target="_blank"
                rel="noopener"
                download>
                Download Image
              </a>

            </div>
          `;

        });


        html += `
          </div>
        `;

      }


      if (video?.url) {

        html += `
          <div
            class="video-box"
            style="margin-top:15px;">

            <video
              controls
              preload="metadata"
              src="${escapeAttribute(video.url)}">
            </video>

            <br>

            <a
              class="download-btn"
              href="${escapeAttribute(video.url)}"
              target="_blank"
              rel="noopener"
              download>
              Download Video
            </a>

          </div>
        `;

      }


      html += `
        </div>
      `;

    }


    detailsContent.innerHTML = html;

    detailsModal.classList.add("show");

  }


  /* =========================================================
     CLOSE MODAL
  ========================================================= */

  closeModal.addEventListener("click", () => {

    detailsModal.classList.remove("show");

  });


  detailsModal.addEventListener("click", (event) => {

    if (event.target === detailsModal) {

      detailsModal.classList.remove("show");

    }

  });


  /* =========================================================
     DELETE COMPLAINT MEDIA FROM FIREBASE STORAGE
  ========================================================= */

  async function deleteComplaintMedia(media) {

    const paths = [];


    /*
     * Images
     */

    if (Array.isArray(media?.images)) {

      for (const image of media.images) {

        if (image?.path) {

          paths.push(image.path);

        }

      }

    }


    /*
     * Video
     */

    if (media?.video?.path) {

      paths.push(media.video.path);

    }


    /*
     * No media
     */

    if (paths.length === 0) {

      return;

    }


    const failed = [];


    /*
     * Delete every file separately.
     *
     * Maximum:
     * 2 images + 1 video
     */

    for (const path of paths) {

      try {

        console.log(
          "Deleting complaint media:",
          path
        );

        const fileRef =
          ref(storage, path);

        await deleteObject(fileRef);

        console.log(
          "Deleted successfully:",
          path
        );

      } catch (error) {

        /*
         * File already deleted = okay.
         */

        if (
          error?.code ===
          "storage/object-not-found"
        ) {

          console.log(
            "File already deleted:",
            path
          );

          continue;

        }


        console.error(
          "Storage delete failed:",
          path,
          error
        );

        failed.push(path);

      }

    }


    if (failed.length > 0) {

      throw new Error(
        "Complaint ki kuch media files Storage se delete nahi ho paayi."
      );

    }

  }


  /* =========================================================
     UPDATE STATUS
  ========================================================= */

  async function updateStatus(id, newStatus) {

    const complaint =
      complaints.find(
        item => item.id === id
      );


    if (!complaint) {

      alert("Complaint nahi mili.");

      return;

    }


    if (
      newStatus === "solved" &&
      complaint.status === "solved"
    ) {

      return;

    }


    if (newStatus === "solved") {

      const confirmed =
        confirm(
          "Complaint ko Solved mark karna hai?\n\n" +
          "Is complaint ki photos aur video Firebase Storage se permanently delete ho jayengi."
        );


      if (!confirmed) {

        return;

      }

    }


    try {

      /*
       * Buttons temporarily disable
       */

      document
        .querySelectorAll(".btn")
        .forEach(btn => {
          btn.disabled = true;
        });


      const complaintRef =
        doc(
          db,
          "parshd",
          "complaints",
          "data",
          id
        );


      /* =====================================================
         NORMAL PENDING STATUS
      ===================================================== */

      if (newStatus === "pending") {

        await updateDoc(
          complaintRef,
          {
            status: "pending",
            solvedAt: null
          }
        );


        complaint.status = "pending";
        complaint.solvedAt = null;


        renderComplaints();

        alert(
          "Complaint Pending mark kar di gayi hai."
        );

        return;

      }


      /* =====================================================
         SOLVED
      ===================================================== */

      if (newStatus === "solved") {

        /*
         * STEP 1
         * First complaint status = solved.
         *
         * Complaint record delete nahi hoga.
         */

        await updateDoc(
          complaintRef,
          {
            status: "solved",
            solvedAt: serverTimestamp()
          }
        );


        complaint.status = "solved";


        /*
         * STEP 2
         * Ab sirf isi complaint ki Storage media
         * delete hogi.
         */

        try {

          await deleteComplaintMedia(
            complaint.media
          );

        } catch (mediaError) {

          console.error(
            "Media deletion error:",
            mediaError
          );


          /*
           * Complaint solved rahegi.
           * Media deletion fail hone par complaint
           * record ko delete nahi karenge.
           */

          alert(
            "Complaint Solved ho gayi hai, lekin media Storage se delete karte waqt problem aayi.\n\n" +
            mediaError.message
          );

          await loadComplaints();

          return;

        }


        /*
         * STEP 3
         * Storage se media successfully delete hone ke baad
         * Firestore me media references bhi empty kar do.
         */

        await updateDoc(
          complaintRef,
          {
            media: {
              images: [],
              video: null
            }
          }
        );


        /*
         * Local data bhi update.
         */

        complaint.media = {
          images: [],
          video: null
        };


        /*
         * Solved date Firestore server timestamp hai,
         * isliye fresh data reload karenge.
         */

        await loadComplaints();


        alert(
          "Complaint Solved kar di gayi.\n\n" +
          "Is complaint ki photos aur video Firebase Storage se delete ho gayi hain."
        );

      }

    } catch (error) {

      console.error(
        "Status update error:",
        error
      );


      alert(
        "Status update nahi ho paya.\n\n" +
        (error.message || "Unknown error")
      );


      /*
       * Fresh Firestore data reload
       */

      await loadComplaints();

    } finally {

      document
        .querySelectorAll(".btn")
        .forEach(btn => {
          btn.disabled = false;
        });

    }

  }


  /* =========================================================
     DATE FORMAT
  ========================================================= */

  function formatDate(timestamp) {

    if (!timestamp) {
      return "-";
    }


    try {

      let date;


      if (
        typeof timestamp.toDate === "function"
      ) {

        date = timestamp.toDate();

      } else if (
        timestamp.seconds
      ) {

        date =
          new Date(
            timestamp.seconds * 1000
          );

      } else {

        date =
          new Date(timestamp);

      }


      if (isNaN(date.getTime())) {
        return "-";
      }


      return date.toLocaleString(
        "en-IN",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch {

      return "-";

    }

  }


  /* =========================================================
     HTML ESCAPE
  ========================================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }

</script>

</body>
</html>

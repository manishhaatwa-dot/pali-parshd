<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>Complaints | Parshd</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #0f172a;
            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        button,
        select {
            font-family: inherit;
        }

        .header {
            min-height: 70px;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f172a;
            color: #ffffff;

            font-size: 20px;
            font-weight: 800;
        }

        .brand-text strong {
            display: block;
            font-size: 18px;
        }

        .brand-text span {
            color: #64748b;
            font-size: 11px;
        }

        .back-button {
            border: 1px solid #dbe1e8;
            background: #ffffff;

            padding: 9px 15px;
            border-radius: 9px;

            cursor: pointer;
            font-weight: 600;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
            padding: 38px 0 60px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin: 0 0 7px;
            font-size: 30px;
        }

        .page-heading p {
            margin: 0;
            color: #64748b;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid #dbe1e8;
            background: #ffffff;

            padding: 10px 17px;
            border-radius: 9px;

            cursor: pointer;
            font-weight: 600;
        }

        .filter-button.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .complaints-list {
            display: grid;
            gap: 15px;
        }

        .complaint-card {
            border: 1px solid #e5e7eb;
            border-radius: 16px;

            padding: 20px;

            background: #ffffff;

            cursor: pointer;

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        .complaint-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px rgba(0,0,0,.07);
        }

        .complaint-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .complaint-id {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .complaint-name {
            margin: 0;
            font-size: 18px;
        }

        .complaint-text {
            margin: 14px 0 10px;
            line-height: 1.6;
            color: #334155;
        }

        .complaint-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;

            color: #64748b;
            font-size: 13px;
        }

        .status {
            display: inline-flex;

            padding: 6px 10px;
            border-radius: 999px;

            font-size: 12px;
            font-weight: 700;
        }

        .status-new {
            background: #eff6ff;
            color: #2563eb;
        }

        .status-pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-solved {
            background: #ecfdf5;
            color: #047857;
        }

        .complaint-actions {
            margin-top: 18px;

            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .action-button {
            border: 1px solid #dbe1e8;
            background: #ffffff;

            padding: 9px 13px;
            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;
        }

        .action-button.primary {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .empty {
            text-align: center;

            padding: 65px 20px;

            border: 1px dashed #cbd5e1;
            border-radius: 16px;

            color: #64748b;
        }

        .empty-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .empty strong {
            display: block;
            color: #334155;
            margin-bottom: 5px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }

        .error-box {
            padding: 20px;
            border-radius: 14px;
            background: #fef2f2;
            color: #b91c1c;
        }

        .modal {
            position: fixed;
            inset: 0;

            background:
                rgba(15, 23, 42, .45);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-card {
            width: min(650px, 100%);
            max-height: 90vh;
            overflow-y: auto;

            background: #ffffff;

            border-radius: 18px;

            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-button {
            border: 0;
            background: #f1f5f9;

            width: 36px;
            height: 36px;

            border-radius: 50%;

            cursor: pointer;
            font-size: 20px;
        }

        .detail-row {
            padding: 12px 0;
            border-bottom: 1px solid #eef2f7;
        }

        .detail-row small {
            display: block;
            color: #64748b;
            margin-bottom: 4px;
        }

        .detail-row strong {
            word-break: break-word;
        }

        .media-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
            margin-top: 10px;
        }

        .media-grid img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .video-preview {
            width: 100%;
            max-height: 400px;
            margin-top: 10px;
            border-radius: 10px;
            background: #000000;
        }

        .media-link {
            display: inline-flex;

            padding: 9px 12px;

            border-radius: 8px;

            background: #eff6ff;
            color: #2563eb;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            margin: 5px 5px 0 0;
        }

        .map-link {
            display: inline-flex;

            margin-top: 8px;

            padding: 9px 12px;

            border-radius: 8px;

            background: #ecfdf5;
            color: #047857;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;
        }

        .modal-status-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;

            margin-top: 20px;
        }

        @media (max-width: 650px) {

            .header {
                padding: 0 4%;
            }

            .container {
                width: 92%;
                padding-top: 28px;
            }

            .page-heading h1 {
                font-size: 25px;
            }

            .complaint-top {
                flex-direction: column;
            }

            .status {
                align-self: flex-start;
            }

            .media-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="brand">

        <div class="brand-logo">
            P
        </div>

        <div class="brand-text">

            <strong>
                Parshd
            </strong>

            <span>
                Complaint Management
            </span>

        </div>

    </div>


    <button
        class="back-button"
        id="backButton"
        type="button"
    >
        ← Dashboard
    </button>

</header>



<main class="container">

    <div class="page-heading">

        <h1>
            Complaints
        </h1>

        <p id="wardText">
            आपके वार्ड की नागरिक शिकायतें
        </p>

    </div>


    <div class="filters">

        <button
            class="filter-button active"
            data-filter="all"
            type="button"
        >
            सभी
        </button>

        <button
            class="filter-button"
            data-filter="new"
            type="button"
        >
            New
        </button>

        <button
            class="filter-button"
            data-filter="pending"
            type="button"
        >
            Pending
        </button>

        <button
            class="filter-button"
            data-filter="solved"
            type="button"
        >
            Solved
        </button>

    </div>


    <section
        id="complaintsList"
        class="complaints-list"
    >

        <div class="loading">
            Complaints load हो रही हैं...
        </div>

    </section>

</main>



<!-- =====================================================
     DETAILS MODAL
===================================================== -->

<div
    id="detailsModal"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2>
                Complaint Details
            </h2>

            <button
                id="closeModal"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <div id="modalContent"></div>

    </div>

</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "../js/firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


import {
    collection,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* =====================================================
   FIRESTORE PATHS
===================================================== */

const PARSHADS_PATH = [
    "parshd",
    "parshads",
    "data"
];


const COMPLAINTS_PATH = [
    "parshd",
    "complaints",
    "data"
];


/* =====================================================
   GLOBAL DATA
===================================================== */

let currentUser = null;

let account = null;

let complaints = [];

let currentFilter = "all";


/* =====================================================
   ELEMENTS
===================================================== */

const list =
    document.getElementById(
        "complaintsList"
    );


const modal =
    document.getElementById(
        "detailsModal"
    );


const modalContent =
    document.getElementById(
        "modalContent"
    );


/* =====================================================
   GET PARSHAD ACCOUNT
   IMPORTANT:
   Direct document read only.
   No collection getDocs here.
===================================================== */

async function getParshadAccount(uid) {

    if (!uid) {

        throw new Error(
            "Parshad UID नहीं मिला।"
        );

    }


    const accountRef =
        doc(
            db,
            ...PARSHADS_PATH,
            uid
        );


    const snapshot =
        await getDoc(
            accountRef
        );


    if (!snapshot.exists()) {

        throw new Error(
            "इस Firebase account का Parshad record नहीं मिला।"
        );

    }


    const data =
        snapshot.data();


    if (
        data.status !== "approved" ||
        data.approved !== true
    ) {

        throw new Error(
            "आपका Parshad account अभी approved नहीं है।"
        );

    }


    return {

        id:
            snapshot.id,

        ...data

    };

}


/* =====================================================
   AUTH READY
===================================================== */

function waitForAuth() {

    return new Promise(
        resolve => {

            const unsubscribe =
                onAuthStateChanged(
                    auth,
                    user => {

                        unsubscribe();

                        resolve(
                            user || null
                        );

                    }
                );

        }
    );

}


/* =====================================================
   LOAD COMPLAINTS
===================================================== */

async function loadComplaints() {

    try {

        list.innerHTML = `

            <div class="loading">
                Complaints load हो रही हैं...
            </div>

        `;


        /* ---------------------------------------------
           AUTH
        --------------------------------------------- */

        currentUser =
            await waitForAuth();


        if (!currentUser) {

            window.location.replace(
                "./index.html"
            );

            return;

        }


        /* ---------------------------------------------
           PARSHAD ACCOUNT
        --------------------------------------------- */

        account =
            await getParshadAccount(
                currentUser.uid
            );


        const currentWard =
            String(
                account.ward ||
                account.wardNumber ||
                ""
            ).trim();


        if (!currentWard) {

            throw new Error(
                "Parshad account में Ward Number नहीं मिला।"
            );

        }


        /* ---------------------------------------------
           WARD TEXT
        --------------------------------------------- */

        const wardText =
            document.getElementById(
                "wardText"
            );


        if (wardText) {

            wardText.textContent =
                `Ward ${currentWard} की नागरिक शिकायतें`;

        }


        /* ---------------------------------------------
           COMPLAINT COLLECTION
        --------------------------------------------- */

        const complaintsRef =
            collection(
                db,
                ...COMPLAINTS_PATH
            );


        const snapshot =
            await getDocs(
                complaintsRef
            );


        complaints = [];


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                /* -------------------------------------
                   TENANT / WARD FILTER
                ------------------------------------- */

                const complaintWard =
                    String(
                        data.wardNumber ||
                        data.wardId ||
                        data.ward ||
                        ""
                    ).trim();


                const complaintParshad =
                    String(
                        data.parshadId ||
                        ""
                    ).trim();


                /*
                 * Primary check:
                 * complaint must belong to
                 * current Parshad.
                 *
                 * Ward check is also applied.
                 */

                if (
                    complaintParshad ===
                    String(currentUser.uid)
                    &&
                    complaintWard ===
                    currentWard
                ) {

                    complaints.push({

                        id:
                            item.id,

                        ...data

                    });

                }

            }
        );


        /* ---------------------------------------------
           SORT
        --------------------------------------------- */

        complaints.sort(
            (a, b) => {

                return (
                    getTime(
                        b.createdAt
                    )
                    -
                    getTime(
                        a.createdAt
                    )
                );

            }
        );


        renderComplaints();


    } catch (error) {

        console.error(
            "Firestore complaint load error:",
            error
        );


        list.innerHTML = `

            <div class="error-box">

                <strong>
                    Complaints load नहीं हो सकीं
                </strong>

                <br><br>

                ${escapeHtml(
                    error?.message ||
                    "Unknown error"
                )}

            </div>

        `;

    }

}


/* =====================================================
   FILTER BUTTONS
===================================================== */

document
    .querySelectorAll(
        "[data-filter]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            "[data-filter]"
                        )
                        .forEach(
                            btn => {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    currentFilter =
                        button.dataset.filter;


                    renderComplaints();

                }
            );

        }
    );


/* =====================================================
   RENDER
===================================================== */

function renderComplaints() {

    let filtered =
        complaints;


    if (
        currentFilter !==
        "all"
    ) {

        filtered =
            complaints.filter(
                complaint =>
                    (
                        complaint.status ||
                        "new"
                    ) ===
                    currentFilter
            );

    }


    if (!filtered.length) {

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📋
                </div>

                <strong>
                    अभी कोई complaint नहीं है
                </strong>

                <span>
                    इस category में कोई complaint उपलब्ध नहीं है।
                </span>

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
            .map(
                createComplaintCard
            )
            .join("");


    /* ---------------------------------------------
       CARD CLICK
    --------------------------------------------- */

    list
        .querySelectorAll(
            "[data-complaint-card]"
        )
        .forEach(
            card => {

                card.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.closest(
                                "button"
                            )
                            ||
                            event.target.closest(
                                "a"
                            )
                        ) {

                            return;

                        }


                        const id =
                            card.dataset.complaintCard;


                        const complaint =
                            complaints.find(
                                item =>
                                    String(
                                        item.id
                                    ) ===
                                    String(id)
                            );


                        if (complaint) {

                            showDetails(
                                complaint
                            );

                        }

                    }
                );

            }
        );


    /* ---------------------------------------------
       DETAILS
    --------------------------------------------- */

    list
        .querySelectorAll(
            "[data-view]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        const id =
                            button.dataset.view;


                        const complaint =
                            complaints.find(
                                item =>
                                    String(
                                        item.id
                                    ) ===
                                    String(id)
                            );


                        if (complaint) {

                            showDetails(
                                complaint
                            );

                        }

                    }
                );

            }
        );


    /* ---------------------------------------------
       STATUS
    --------------------------------------------- */

    list
        .querySelectorAll(
            "[data-status]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        updateStatus(
                            button.dataset.id,
                            button.dataset.status
                        );

                    }
                );

            }
        );

}


/* =====================================================
   CREATE CARD
===================================================== */

function createComplaintCard(
    complaint
) {

    const status =
        String(
            complaint.status ||
            "new"
        ).toLowerCase();


    const statusText =
        status === "new"
            ? "New"
            : status === "pending"
                ? "Pending"
                : status === "solved"
                    ? "Solved"
                    : status;


    const id =
        complaint.publicComplaintId ||
        complaint.complaintId ||
        complaint.id ||
        "-";


    const name =
        complaint.citizenName ||
        "Citizen";


    const text =
        complaint.complaintText ||
        "Complaint details उपलब्ध नहीं हैं।";


    const phone =
        complaint.citizenPhone ||
        "-";


    const ward =
        complaint.wardNumber ||
        account?.ward ||
        "-";


    const date =
        formatDate(
            complaint.createdAt
        );


    const images =
        Array.isArray(
            complaint.media?.images
        )
            ? complaint.media.images
            : [];


    const imageCount =
        images.length;


    const hasVideo =
        !!complaint.media?.video;


    return `

        <article
            class="complaint-card"
            data-complaint-card="${escapeHtml(
                complaint.id
            )}"
        >

            <div class="complaint-top">

                <div>

                    <div class="complaint-id">
                        ID: ${escapeHtml(id)}
                    </div>

                    <h3 class="complaint-name">
                        ${escapeHtml(name)}
                    </h3>

                </div>


                <span
                    class="status status-${escapeHtml(
                        status
                    )}"
                >
                    ${escapeHtml(statusText)}
                </span>

            </div>


            <p class="complaint-text">
                ${escapeHtml(text)}
            </p>


            <div class="complaint-details">

                <span>
                    📱 ${escapeHtml(phone)}
                </span>

                <span>
                    📍 Ward ${escapeHtml(ward)}
                </span>

                <span>
                    📅 ${escapeHtml(date)}
                </span>

                ${
                    imageCount > 0
                    ? `
                        <span>
                            📷 ${imageCount}
                        </span>
                    `
                    : ""
                }

                ${
                    hasVideo
                    ? `
                        <span>
                            🎥 Video
                        </span>
                    `
                    : ""
                }

            </div>


            <div class="complaint-actions">

                <button
                    class="action-button"
                    data-view="${escapeHtml(
                        complaint.id
                    )}"
                    type="button"
                >
                    👁 Details
                </button>


                ${
                    status === "new"
                    ? `
                        <button
                            class="action-button"
                            data-id="${escapeHtml(
                                complaint.id
                            )}"
                            data-status="pending"
                            type="button"
                        >
                            Pending करें
                        </button>
                    `
                    : ""
                }


                ${
                    status !== "solved"
                    ? `
                        <button
                            class="action-button primary"
                            data-id="${escapeHtml(
                                complaint.id
                            )}"
                            data-status="solved"
                            type="button"
                        >
                            ✓ Solved करें
                        </button>
                    `
                    : ""
                }

            </div>

        </article>

    `;

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateStatus(
    id,
    newStatus
) {

    const complaint =
        complaints.find(
            item =>
                String(
                    item.id
                ) ===
                String(id)
        );


    if (!complaint) {
        return;
    }


    try {

        const complaintRef =
            doc(
                db,
                ...COMPLAINTS_PATH,
                id
            );


        const updateData = {

            status:
                newStatus

        };


        if (
            newStatus ===
            "solved"
        ) {

            updateData.solvedAt =
                serverTimestamp();

        } else {

            updateData.solvedAt =
                null;

        }


        await updateDoc(
            complaintRef,
            updateData
        );


        complaint.status =
            newStatus;


        complaint.solvedAt =
            updateData.solvedAt;


        renderComplaints();


        if (
            modal.classList.contains(
                "active"
            )
        ) {

            showDetails(
                complaint
            );

        }


        if (
            newStatus ===
            "solved"
        ) {

            alert(
                "Complaint Solved mark कर दी गई है।"
            );

        }

    } catch (error) {

        console.error(
            "Status update error:",
            error
        );


        alert(
            error?.message ||
            "Complaint status update नहीं हो पाया।"
        );

    }

}


/* =====================================================
   DETAILS MODAL
===================================================== */

function showDetails(
    complaint
) {

    const id =
        complaint.publicComplaintId ||
        complaint.complaintId ||
        complaint.id ||
        "-";


    const location =
        complaint.location;


    const media =
        complaint.media ||
        {};


    /* =================================================
       PHOTOS
    ================================================= */

    let imagesHTML = "";


    if (
        Array.isArray(
            media.images
        )
        &&
        media.images.length
    ) {

        const validImages =
            media.images
                .map(
                    image =>
                        getMediaUrl(
                            image
                        )
                )
                .filter(
                    url => !!url
                );


        if (validImages.length) {

            imagesHTML = `

                <div class="detail-row">

                    <small>
                        Photos
                    </small>

                    <div class="media-grid">

                        ${
                            validImages
                                .map(
                                    url => `

                                        <a
                                            href="${escapeHtml(url)}"
                                            target="_blank"
                                            rel="noopener"
                                        >

                                            <img
                                                src="${escapeHtml(url)}"
                                                alt="Complaint Photo"
                                                loading="lazy"
                                            >

                                        </a>

                                    `
                                )
                                .join("")
                        }

                    </div>

                </div>

            `;

        }

    }


    /* =================================================
       VIDEO
    ================================================= */

    let videoHTML = "";


    const videoUrl =
        getMediaUrl(
            media.video
        );


    if (videoUrl) {

        videoHTML = `

            <div class="detail-row">

                <small>
                    Video
                </small>

                <video
                    class="video-preview"
                    controls
                    preload="metadata"
                >

                    <source
                        src="${escapeHtml(videoUrl)}"
                    >

                    आपका browser video support नहीं करता।

                </video>


                <a
                    class="media-link"
                    href="${escapeHtml(videoUrl)}"
                    target="_blank"
                    rel="noopener"
                >
                    🎥 Video खोलें
                </a>

            </div>

        `;

    }


    /* =================================================
       LOCATION
    ================================================= */

    let locationHTML = "";


    if (
        location
        &&
        location.latitude !== undefined
        &&
        location.longitude !== undefined
    ) {

        const mapUrl =
            `https://www.google.com/maps?q=${
                encodeURIComponent(
                    location.latitude
                )
            },${
                encodeURIComponent(
                    location.longitude
                )
            }`;


        locationHTML = `

            <div class="detail-row">

                <small>
                    GPS Location
                </small>

                <strong>
                    ${escapeHtml(
                        location.latitude
                    )},
                    ${escapeHtml(
                        location.longitude
                    )}
                </strong>

                <br>

                <small>
                    Accuracy:
                    ${escapeHtml(
                        location.accuracy ??
                        "-"
                    )} meters
                </small>

                <a
                    class="map-link"
                    href="${escapeHtml(mapUrl)}"
                    target="_blank"
                    rel="noopener"
                >
                    📍 Map पर देखें
                </a>

            </div>

        `;

    }


    /* =================================================
       MODAL HTML
    ================================================= */

    modalContent.innerHTML = `

        <div class="detail-row">

            <small>
                Complaint ID
            </small>

            <strong>
                ${escapeHtml(id)}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Citizen Name
            </small>

            <strong>
                ${escapeHtml(
                    complaint.citizenName ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Mobile
            </small>

            <strong>
                ${escapeHtml(
                    complaint.citizenPhone ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Ward
            </small>

            <strong>
                ${escapeHtml(
                    complaint.wardNumber ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Address
            </small>

            <strong>
                ${escapeHtml(
                    complaint.address ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Complaint
            </small>

            <strong>
                ${escapeHtml(
                    complaint.complaintText ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Status
            </small>

            <strong>
                ${escapeHtml(
                    complaint.status ||
                    "new"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Created
            </small>

            <strong>
                ${escapeHtml(
                    formatDate(
                        complaint.createdAt
                    )
                )}
            </strong>

        </div>


        ${
            complaint.solvedAt
            ? `
                <div class="detail-row">

                    <small>
                        Solved
                    </small>

                    <strong>
                        ${escapeHtml(
                            formatDate(
                                complaint.solvedAt
                            )
                        )}
                    </strong>

                </div>
            `
            : ""
        }


        ${locationHTML}

        ${imagesHTML}

        ${videoHTML}


        <div class="modal-status-actions">

            ${
                complaint.status !== "pending"
                &&
                complaint.status !== "solved"
                ? `
                    <button
                        class="action-button"
                        id="modalPendingButton"
                        type="button"
                    >
                        Pending करें
                    </button>
                `
                : ""
            }


            ${
                complaint.status !== "solved"
                ? `
                    <button
                        class="action-button primary"
                        id="modalSolvedButton"
                        type="button"
                    >
                        ✓ Solved करें
                    </button>
                `
                : ""
            }

        </div>

    `;


    /* =================================================
       PENDING
    ================================================= */

    const pendingButton =
        document.getElementById(
            "modalPendingButton"
        );


    if (pendingButton) {

        pendingButton.addEventListener(
            "click",
            async () => {

                await updateStatus(
                    complaint.id,
                    "pending"
                );

            }
        );

    }


    /* =================================================
       SOLVED
    ================================================= */

    const solvedButton =
        document.getElementById(
            "modalSolvedButton"
        );


    if (solvedButton) {

        solvedButton.addEventListener(
            "click",
            async () => {

                await updateStatus(
                    complaint.id,
                    "solved"
                );

            }
        );

    }


    modal.classList.add(
        "active"
    );

}


/* =====================================================
   MEDIA URL
===================================================== */

function getMediaUrl(
    media
) {

    if (!media) {
        return "";
    }


    if (
        typeof media ===
        "string"
    ) {

        return media;

    }


    return (
        media.url ||
        media.downloadURL ||
        media.downloadUrl ||
        ""
    );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

document
    .getElementById(
        "closeModal"
    )
    .addEventListener(
        "click",
        closeModal
    );


modal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modal
        ) {

            closeModal();

        }

    }
);


function closeModal() {

    modal.classList.remove(
        "active"
    );

}


/* =====================================================
   DASHBOARD
===================================================== */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "dashboard.html";

        }
    );


/* =====================================================
   FIRESTORE TIME
===================================================== */

function getTime(
    value
) {

    if (!value) {
        return 0;
    }


    try {

        /* Firestore Timestamp */

        if (
            typeof value.toDate ===
            "function"
        ) {

            return value
                .toDate()
                .getTime();

        }


        /* Firestore timestamp object */

        if (
            typeof value.seconds ===
            "number"
        ) {

            return (
                value.seconds * 1000
            );

        }


        /* Date */

        if (
            value instanceof Date
        ) {

            return value.getTime();

        }


        /* String / number */

        const time =
            new Date(
                value
            ).getTime();


        return Number.isFinite(
            time
        )
            ? time
            : 0;

    } catch {

        return 0;

    }

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    value
) {

    if (!value) {
        return "-";
    }


    try {

        let date;


        if (
            typeof value.toDate ===
            "function"
        ) {

            date =
                value.toDate();

        } else if (
            value instanceof Date
        ) {

            date =
                value;

        } else if (
            typeof value.seconds ===
            "number"
        ) {

            date =
                new Date(
                    value.seconds *
                    1000
                );

        } else {

            date =
                new Date(
                    value
                );

        }


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "-";

        }


        return date.toLocaleString(
            "hi-IN",
            {
                dateStyle:
                    "medium",

                timeStyle:
                    "short"
            }
        );

    } catch {

        return "-";

    }

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

   START
===================================================== */

loadComplaints();

<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>Complaints | Parshd</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #0f172a;
            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        button,
        select {
            font-family: inherit;
        }

        .header {
            min-height: 70px;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f172a;
            color: #ffffff;

            font-size: 20px;
            font-weight: 800;
        }

        .brand-text strong {
            display: block;
            font-size: 18px;
        }

        .brand-text span {
            color: #64748b;
            font-size: 11px;
        }

        .back-button {
            border: 1px solid #dbe1e8;
            background: #ffffff;

            padding: 9px 15px;
            border-radius: 9px;

            cursor: pointer;
            font-weight: 600;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
            padding: 38px 0 60px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin: 0 0 7px;
            font-size: 30px;
        }

        .page-heading p {
            margin: 0;
            color: #64748b;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: 1px solid #dbe1e8;
            background: #ffffff;

            padding: 10px 17px;
            border-radius: 9px;

            cursor: pointer;
            font-weight: 600;
        }

        .filter-button.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .complaints-list {
            display: grid;
            gap: 15px;
        }

        .complaint-card {
            border: 1px solid #e5e7eb;
            border-radius: 16px;

            padding: 20px;

            background: #ffffff;

            cursor: pointer;

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        .complaint-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px rgba(0,0,0,.07);
        }

        .complaint-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .complaint-id {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .complaint-name {
            margin: 0;
            font-size: 18px;
        }

        .complaint-text {
            margin: 14px 0 10px;
            line-height: 1.6;
            color: #334155;
        }

        .complaint-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;

            color: #64748b;
            font-size: 13px;
        }

        .status {
            display: inline-flex;

            padding: 6px 10px;
            border-radius: 999px;

            font-size: 12px;
            font-weight: 700;
        }

        .status-new {
            background: #eff6ff;
            color: #2563eb;
        }

        .status-pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-solved {
            background: #ecfdf5;
            color: #047857;
        }

        .complaint-actions {
            margin-top: 18px;

            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .action-button {
            border: 1px solid #dbe1e8;
            background: #ffffff;

            padding: 9px 13px;
            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;
        }

        .action-button.primary {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .empty {
            text-align: center;

            padding: 65px 20px;

            border: 1px dashed #cbd5e1;
            border-radius: 16px;

            color: #64748b;
        }

        .empty-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .empty strong {
            display: block;
            color: #334155;
            margin-bottom: 5px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }

        .error-box {
            padding: 20px;
            border-radius: 14px;
            background: #fef2f2;
            color: #b91c1c;
        }

        .modal {
            position: fixed;
            inset: 0;

            background:
                rgba(15, 23, 42, .45);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-card {
            width: min(650px, 100%);
            max-height: 90vh;
            overflow-y: auto;

            background: #ffffff;

            border-radius: 18px;

            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-button {
            border: 0;
            background: #f1f5f9;

            width: 36px;
            height: 36px;

            border-radius: 50%;

            cursor: pointer;
            font-size: 20px;
        }

        .detail-row {
            padding: 12px 0;
            border-bottom: 1px solid #eef2f7;
        }

        .detail-row small {
            display: block;
            color: #64748b;
            margin-bottom: 4px;
        }

        .detail-row strong {
            word-break: break-word;
        }

        .media-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
            margin-top: 10px;
        }

        .media-grid img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .media-link {
            display: inline-flex;

            padding: 9px 12px;

            border-radius: 8px;

            background: #eff6ff;
            color: #2563eb;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            margin: 5px 5px 0 0;
        }

        .map-link {
            display: inline-flex;

            margin-top: 8px;

            padding: 9px 12px;

            border-radius: 8px;

            background: #ecfdf5;
            color: #047857;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;
        }

        .modal-status-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;

            margin-top: 20px;
        }

        @media (max-width: 650px) {

            .header {
                padding: 0 4%;
            }

            .container {
                width: 92%;
                padding-top: 28px;
            }

            .page-heading h1 {
                font-size: 25px;
            }

            .complaint-top {
                flex-direction: column;
            }

            .status {
                align-self: flex-start;
            }

            .media-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="brand">

        <div class="brand-logo">
            P
        </div>

        <div class="brand-text">

            <strong>
                Parshd
            </strong>

            <span>
                Complaint Management
            </span>

        </div>

    </div>


    <button
        class="back-button"
        id="backButton"
        type="button"
    >
        ← Dashboard
    </button>

</header>



<main class="container">

    <div class="page-heading">

        <h1>
            Complaints
        </h1>

        <p id="wardText">
            आपके वार्ड की नागरिक शिकायतें
        </p>

    </div>


    <div class="filters">

        <button
            class="filter-button active"
            data-filter="all"
        >
            सभी
        </button>

        <button
            class="filter-button"
            data-filter="new"
        >
            New
        </button>

        <button
            class="filter-button"
            data-filter="pending"
        >
            Pending
        </button>

        <button
            class="filter-button"
            data-filter="solved"
        >
            Solved
        </button>

    </div>


    <section
        id="complaintsList"
        class="complaints-list"
    >

        <div class="loading">
            Complaints load हो रही हैं...
        </div>

    </section>

</main>



<!-- =========================================
     DETAILS MODAL
========================================== -->

<div
    id="detailsModal"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2>
                Complaint Details
            </h2>

            <button
                id="closeModal"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <div id="modalContent"></div>

    </div>

</div>



<script type="module">

import {
    getDemoSession
} from "./login.js";


import { db } from "../js/firebase-config.js";


import {
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


// =====================================================
// SESSION
// =====================================================

const session =
    getDemoSession();


if (!session) {

    window.location.href =
        "index.html";

}


// =====================================================
// FIRESTORE PATH
// =====================================================

const COMPLAINTS_COLLECTION = [
    "parshd",
    "complaints",
    "data"
];


// =====================================================
// DATA
// =====================================================

let complaints = [];

let currentFilter = "all";


// =====================================================
// ELEMENTS
// =====================================================

const list =
    document.getElementById(
        "complaintsList"
    );

const modal =
    document.getElementById(
        "detailsModal"
    );

const modalContent =
    document.getElementById(
        "modalContent"
    );


// =====================================================
// LOAD FIRESTORE COMPLAINTS
// =====================================================

async function loadComplaints() {

    try {

        list.innerHTML = `

            <div class="loading">
                Complaints load हो रही हैं...
            </div>

        `;


        const complaintsRef =
            collection(
                db,
                ...COMPLAINTS_COLLECTION
            );


        const snapshot =
            await getDocs(
                complaintsRef
            );


        complaints = [];


        snapshot.forEach(
            item => {

                complaints.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );


        const currentWard =
            String(
                session?.ward ||
                ""
            ).trim();


        if (currentWard) {

            complaints =
                complaints.filter(
                    complaint => {

                        const ward =
                            String(
                                complaint.wardNumber ||
                                complaint.wardId ||
                                complaint.ward ||
                                ""
                            ).trim();


                        return ward === currentWard;

                    }
                );

        }


        complaints.sort(
            (a, b) => {

                return (
                    getTime(b.createdAt) -
                    getTime(a.createdAt)
                );

            }
        );


        updateWardText();

        renderComplaints();


    } catch (error) {

        console.error(
            "Firestore complaint load error:",
            error
        );


        list.innerHTML = `

            <div class="error-box">

                <strong>
                    Complaints load नहीं हो सकीं
                </strong>

                <br><br>

                कृपया page refresh करके दोबारा try करें।

            </div>

        `;

    }

}


// =====================================================
// WARD TEXT
// =====================================================

function updateWardText() {

    const wardText =
        document.getElementById(
            "wardText"
        );


    if (!wardText) {
        return;
    }


    if (session?.ward) {

        wardText.textContent =
            `Ward ${session.ward} की नागरिक शिकायतें`;

    }

}


// =====================================================
// FILTER BUTTONS
// =====================================================

document
    .querySelectorAll(
        "[data-filter]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            "[data-filter]"
                        )
                        .forEach(
                            btn => {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    currentFilter =
                        button.dataset.filter;


                    renderComplaints();

                }
            );

        }
    );


// =====================================================
// RENDER
// =====================================================

function renderComplaints() {

    let filtered =
        complaints;


    if (
        currentFilter !==
        "all"
    ) {

        filtered =
            complaints.filter(
                complaint =>
                    (
                        complaint.status ||
                        "new"
                    ) ===
                    currentFilter
            );

    }


    if (!filtered.length) {

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📋
                </div>

                <strong>
                    अभी कोई complaint नहीं है
                </strong>

                <span>
                    इस category में कोई complaint उपलब्ध नहीं है।
                </span>

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
            .map(
                createComplaintCard
            )
            .join("");


    // ---------------------------------------------
    // WHOLE CARD CLICK
    // ---------------------------------------------

    list
        .querySelectorAll(
            "[data-complaint-card]"
        )
        .forEach(
            card => {

                card.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.closest(
                                "button"
                            ) ||
                            event.target.closest(
                                "a"
                            )
                        ) {

                            return;

                        }


                        const id =
                            card.dataset.complaintCard;


                        const complaint =
                            complaints.find(
                                item =>
                                    String(
                                        item.id
                                    ) ===
                                    String(id)
                            );


                        if (complaint) {

                            showDetails(
                                complaint
                            );

                        }

                    }
                );

            }
        );


    // ---------------------------------------------
    // DETAILS BUTTON
    // ---------------------------------------------

    list
        .querySelectorAll(
            "[data-view]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        const id =
                            button.dataset.view;


                        const complaint =
                            complaints.find(
                                item =>
                                    String(
                                        item.id
                                    ) ===
                                    String(id)
                            );


                        if (complaint) {

                            showDetails(
                                complaint
                            );

                        }

                    }
                );

            }
        );


    // ---------------------------------------------
    // STATUS BUTTONS
    // ---------------------------------------------

    list
        .querySelectorAll(
            "[data-status]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        updateStatus(
                            button.dataset.id,
                            button.dataset.status
                        );

                    }
                );

            }
        );

}


// =====================================================
// CARD
// =====================================================

function createComplaintCard(
    complaint
) {

    const status =
        String(
            complaint.status ||
            "new"
        ).toLowerCase();


    const statusText =
        status === "new"
            ? "New"
            : status === "pending"
                ? "Pending"
                : status === "solved"
                    ? "Solved"
                    : status;


    const id =
        complaint.publicComplaintId ||
        complaint.complaintId ||
        complaint.id ||
        "-";


    const name =
        complaint.citizenName ||
        "Citizen";


    const text =
        complaint.complaintText ||
        "Complaint details उपलब्ध नहीं हैं।";


    const phone =
        complaint.citizenPhone ||
        "-";


    const ward =
        complaint.wardNumber ||
        session?.ward ||
        "-";


    const date =
        formatDate(
            complaint.createdAt
        );


    const imageCount =
        Array.isArray(
            complaint.media?.images
        )
            ? complaint.media.images.length
            : 0;


    const hasVideo =
        !!complaint.media?.video;


    return `

        <article
            class="complaint-card"
            data-complaint-card="${escapeHtml(
                complaint.id
            )}"
            title="Complaint details देखने के लिए click करें"
        >

            <div class="complaint-top">

                <div>

                    <div class="complaint-id">
                        ID: ${escapeHtml(id)}
                    </div>

                    <h3 class="complaint-name">
                        ${escapeHtml(name)}
                    </h3>

                </div>


                <span
                    class="status status-${escapeHtml(
                        status
                    )}"
                >
                    ${escapeHtml(statusText)}
                </span>

            </div>


            <p class="complaint-text">
                ${escapeHtml(text)}
            </p>


            <div class="complaint-details">

                <span>
                    📱 ${escapeHtml(phone)}
                </span>

                <span>
                    📍 Ward ${escapeHtml(ward)}
                </span>

                <span>
                    📅 ${escapeHtml(date)}
                </span>

                ${
                    imageCount > 0
                    ? `
                        <span>
                            📷 ${imageCount}
                        </span>
                    `
                    : ""
                }

                ${
                    hasVideo
                    ? `
                        <span>
                            🎥 Video
                        </span>
                    `
                    : ""
                }

            </div>


            <div class="complaint-actions">

                <button
                    class="action-button"
                    data-view="${escapeHtml(
                        complaint.id
                    )}"
                    type="button"
                >
                    👁 Details
                </button>


                ${
                    status === "new"
                    ? `
                        <button
                            class="action-button"
                            data-id="${escapeHtml(
                                complaint.id
                            )}"
                            data-status="pending"
                            type="button"
                        >
                            Pending करें
                        </button>
                    `
                    : ""
                }


                ${
                    status !== "solved"
                    ? `
                        <button
                            class="action-button primary"
                            data-id="${escapeHtml(
                                complaint.id
                            )}"
                            data-status="solved"
                            type="button"
                        >
                            ✓ Solved करें
                        </button>
                    `
                    : ""
                }

            </div>

        </article>

    `;

}


// =====================================================
// UPDATE STATUS
// =====================================================

async function updateStatus(
    id,
    newStatus
) {

    const complaint =
        complaints.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!complaint) {
        return;
    }


    try {

        const complaintRef =
            doc(
                db,
                ...COMPLAINTS_COLLECTION,
                id
            );


        const updateData = {

            status:
                newStatus

        };


        if (
            newStatus ===
            "solved"
        ) {

            updateData.solvedAt =
                new Date().toISOString();

        } else {

            updateData.solvedAt =
                null;

        }


        await updateDoc(
            complaintRef,
            updateData
        );


        // Update local UI data

        complaint.status =
            newStatus;


        complaint.solvedAt =
            updateData.solvedAt;


        renderComplaints();


        if (
            newStatus ===
            "solved"
        ) {

            alert(
                "Complaint Solved mark कर दी गई है।"
            );

        }

    } catch (error) {

        console.error(
            "Status update error:",
            error
        );


        alert(
            "Complaint status update नहीं हो पाया।"
        );

    }

}


// =====================================================
// DETAILS MODAL
// =====================================================

function showDetails(
    complaint
) {

    const id =
        complaint.publicComplaintId ||
        complaint.complaintId ||
        complaint.id ||
        "-";


    const location =
        complaint.location;


    const media =
        complaint.media || {};


    let imagesHTML = "";


    if (
        Array.isArray(
            media.images
        ) &&
        media.images.length
    ) {

        imagesHTML = `

            <div class="detail-row">

                <small>
                    Photos
                </small>

                <div class="media-grid">

                    ${
                        media.images
                            .map(
                                image => {

                                    const url =
                                        getMediaUrl(
                                            image
                                        );


                                    if (!url) {
                                        return "";
                                    }


                                    return `

                                        <a
                                            href="${escapeHtml(url)}"
                                            target="_blank"
                                            rel="noopener"
                                        >

                                            <img
                                                src="${escapeHtml(url)}"
                                                alt="Complaint Photo"
                                            >

                                        </a>

                                    `;

                                }
                            )
                            .join("")
                    }

                </div>

            </div>

        `;

    }


    let videoHTML = "";


    const videoUrl =
        getMediaUrl(
            media.video
        );


    if (videoUrl) {

        videoHTML = `

            <div class="detail-row">

                <small>
                    Video
                </small>

                <a
                    class="media-link"
                    href="${escapeHtml(videoUrl)}"
                    target="_blank"
                    rel="noopener"
                >
                    🎥 Video देखें
                </a>

            </div>

        `;

    }


    let locationHTML = "";


    if (
        location &&
        location.latitude !== undefined &&
        location.longitude !== undefined
    ) {

        const mapUrl =
            `https://www.google.com/maps?q=${
                encodeURIComponent(
                    location.latitude
                )
            },${
                encodeURIComponent(
                    location.longitude
                )
            }`;


        locationHTML = `

            <div class="detail-row">

                <small>
                    GPS Location
                </small>

                <strong>
                    ${escapeHtml(
                        location.latitude
                    )},
                    ${escapeHtml(
                        location.longitude
                    )}
                </strong>

                <br>

                <small>
                    Accuracy:
                    ${escapeHtml(
                        location.accuracy ??
                        "-"
                    )} meters
                </small>

                <a
                    class="map-link"
                    href="${escapeHtml(mapUrl)}"
                    target="_blank"
                    rel="noopener"
                >
                    📍 Map पर देखें
                </a>

            </div>

        `;

    }


    modalContent.innerHTML = `

        <div class="detail-row">

            <small>
                Complaint ID
            </small>

            <strong>
                ${escapeHtml(id)}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Citizen Name
            </small>

            <strong>
                ${escapeHtml(
                    complaint.citizenName ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Mobile
            </small>

            <strong>
                ${escapeHtml(
                    complaint.citizenPhone ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Ward
            </small>

            <strong>
                ${escapeHtml(
                    complaint.wardNumber ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Address
            </small>

            <strong>
                ${escapeHtml(
                    complaint.address ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Complaint
            </small>

            <strong>
                ${escapeHtml(
                    complaint.complaintText ||
                    "-"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Status
            </small>

            <strong>
                ${escapeHtml(
                    complaint.status ||
                    "new"
                )}
            </strong>

        </div>


        <div class="detail-row">

            <small>
                Created
            </small>

            <strong>
                ${escapeHtml(
                    formatDate(
                        complaint.createdAt
                    )
                )}
            </strong>

        </div>


        ${
            complaint.solvedAt
            ? `
                <div class="detail-row">

                    <small>
                        Solved
                    </small>

                    <strong>
                        ${escapeHtml(
                            formatDate(
                                complaint.solvedAt
                            )
                        )}
                    </strong>

                </div>
            `
            : ""
        }


        ${locationHTML}

        ${imagesHTML}

        ${videoHTML}


        <div class="modal-status-actions">

            ${
                complaint.status !== "pending" &&
                complaint.status !== "solved"
                ? `
                    <button
                        class="action-button"
                        id="modalPendingButton"
                        type="button"
                    >
                        Pending करें
                    </button>
                `
                : ""
            }


            ${
                complaint.status !== "solved"
                ? `
                    <button
                        class="action-button primary"
                        id="modalSolvedButton"
                        type="button"
                    >
                        ✓ Solved करें
                    </button>
                `
                : ""
            }

        </div>

    `;


    const pendingButton =
        document.getElementById(
            "modalPendingButton"
        );


    if (pendingButton) {

        pendingButton.addEventListener(
            "click",
            async () => {

                await updateStatus(
                    complaint.id,
                    "pending"
                );

                showDetails(
                    complaint
                );

            }
        );

    }


    const solvedButton =
        document.getElementById(
            "modalSolvedButton"
        );


    if (solvedButton) {

        solvedButton.addEventListener(
            "click",
            async () => {

                await updateStatus(
                    complaint.id,
                    "solved"
                );

                showDetails(
                    complaint
                );

            }
        );

    }


    modal.classList.add(
        "active"
    );

}

function getMediaUrl(
    media
) {

    if (!media) {
        return "";
    }


    if (
        typeof media ===
        "string"
    ) {

        return media;

    }


    return (
        media.url ||
        media.downloadURL ||
        media.downloadUrl ||
        ""
    );

}

// =====================================================
// DATE
// =====================================================

function getTime(
    value
) {

    if (!value) {
        return 0;
    }


    const time =
        new Date(
            value
        ).getTime();


    return Number.isFinite(
        time
    )
        ? time
        : 0;

}


function formatDate(
    value
) {

    if (!value) {
        return "-";
    }


    try {

        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "-";

        }


        return date.toLocaleString(
            "hi-IN",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

    } catch {

        return "-";

    }

}


// =====================================================
// HTML SECURITY
// =====================================================

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

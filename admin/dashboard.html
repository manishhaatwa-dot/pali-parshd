<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Parshd"
    >

    <title>Parshd Dashboard</title>


    <link
        rel="apple-touch-icon"
        href="../assets/icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #ffffff;
        }


        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #111827;

            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
        }


        button {
            font-family: inherit;
        }


        .dashboard {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            background: #ffffff;
        }


        /* =====================================
           HEADER
        ====================================== */

        .dashboard-header {
            width: 100%;

            border-bottom: 1px solid #e5e7eb;

            background: #ffffff;

            position: sticky;
            top: 0;

            z-index: 100;
        }


        .header-inner {
            width: 100%;
            max-width: 1250px;

            margin: 0 auto;

            min-height: 70px;

            padding: 12px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        .brand {
            display: flex;

            align-items: center;

            gap: 11px;

            min-width: 0;
        }


        .brand-logo {
            width: 44px;
            height: 44px;

            border-radius: 11px;

            object-fit: contain;

            flex-shrink: 0;
        }


        .brand-title {
            margin: 0;

            font-size: 20px;

            line-height: 1.2;

            font-weight: 750;

            color: #111827;
        }


        .brand-subtitle {
            margin: 3px 0 0;

            font-size: 12px;

            color: #6b7280;
        }


        .header-actions {
            display: flex;

            align-items: center;

            gap: 9px;
        }


        .header-button {
            min-height: 40px;

            padding: 0 13px;

            border: 1px solid #e5e7eb;

            border-radius: 9px;

            background: #ffffff;

            color: #374151;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }


        .header-button:hover {
            background: #f9fafb;
        }


        .logout-button {
            border-color: #fecaca;

            color: #b91c1c;
        }


        /* =====================================
           MAIN
        ====================================== */

        .dashboard-main {
            width: 100%;

            max-width: 1250px;

            margin: 0 auto;

            padding: 25px 20px 40px;
        }


        .welcome-section {
            margin-bottom: 23px;
        }


        .welcome-title {
            margin: 0;

            font-size: 27px;

            line-height: 1.25;

            font-weight: 750;

            color: #111827;
        }


        .welcome-text {
            margin: 7px 0 0;

            font-size: 14px;

            line-height: 1.5;

            color: #6b7280;
        }


        /* =====================================
           PROFILE CARD
        ====================================== */

        .profile-card {
            width: 100%;

            padding: 22px;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            background: #ffffff;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            margin-bottom: 24px;
        }


        /* =====================================
           PROFILE MEDIA
        ====================================== */

        .profile-info {
            display: flex;

            align-items: center;

            gap: 20px;

            min-width: 0;

            flex: 1;
        }


        .profile-media {
            width: 120px;

            display: flex;

            flex-direction: column;

            align-items: center;

            flex-shrink: 0;
        }


        /* SMALL PARTY LOGO */

        .party-logo-circle {
            width: 44px;
            height: 44px;

            border-radius: 50%;

            border: 1px solid #e5e7eb;

            background: #ffffff;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 9px;

            box-shadow:
                0 2px 7px
                rgba(0, 0, 0, 0.06);
        }


        .party-logo-circle img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* BIG PARSHAD PHOTO */

        .profile-photo {
            width: 100px;
            height: 100px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #e5e7eb;

            background: #f8fafc;

            display: block;
        }


        /* =====================================
           PROFILE DETAILS
        ====================================== */

        .profile-details {
            min-width: 0;
        }


        .profile-name {
            margin: 0;

            font-size: 22px;

            font-weight: 750;

            color: #111827;

            word-break: break-word;
        }


        .profile-meta {
            margin: 7px 0 0;

            font-size: 14px;

            color: #6b7280;

            line-height: 1.6;

            word-break: break-word;
        }


        .profile-status {
            display: inline-flex;

            align-items: center;

            margin-top: 9px;

            padding: 5px 10px;

            border-radius: 999px;

            background: #f0fdf4;

            color: #15803d;

            font-size: 12px;

            font-weight: 650;
        }


        .edit-profile-button {
            min-height: 43px;

            padding: 0 15px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            background: #ffffff;

            color: #111827;

            font-size: 14px;

            font-weight: 650;

            cursor: pointer;

            flex-shrink: 0;
        }


        .edit-profile-button:hover {
            background: #f9fafb;
        }


        /* =====================================
           SECTION
        ====================================== */

        .section-title {
            margin: 0 0 13px;

            font-size: 19px;

            font-weight: 700;

            color: #111827;
        }


        /* =====================================
           STATS
        ====================================== */

        .stats-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 27px;
        }


        .stat-card {
            min-width: 0;

            padding: 20px;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            background: #ffffff;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        .stat-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 22px
                rgba(0, 0, 0, 0.06);
        }


        .stat-label {
            margin: 0;

            font-size: 14px;

            color: #6b7280;
        }


        .stat-number {
            margin: 8px 0 0;

            font-size: 30px;

            line-height: 1;

            font-weight: 750;

            color: #111827;
        }


        /* =====================================
           QUICK ACTIONS
        ====================================== */

        .actions-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 27px;
        }


        .action-card {
            width: 100%;

            min-height: 90px;

            padding: 17px;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            background: #ffffff;

            display: flex;

            align-items: center;

            gap: 14px;

            text-align: left;

            cursor: pointer;
        }


        .action-card:hover {
            background: #fafafa;
        }


        .action-icon {
            width: 45px;
            height: 45px;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f3f4f6;

            font-size: 20px;

            flex-shrink: 0;
        }


        .action-content {
            min-width: 0;
        }


        .action-title {
            margin: 0;

            font-size: 15px;

            font-weight: 700;

            color: #111827;
        }


        .action-description {
            margin: 4px 0 0;

            font-size: 12px;

            line-height: 1.4;

            color: #6b7280;
        }


        /* =====================================
           RECENT COMPLAINTS
        ====================================== */

        .complaints-section {
            width: 100%;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            background: #ffffff;

            overflow: hidden;
        }


        .complaints-header {
            padding: 18px 20px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        .complaints-title {
            margin: 0;

            font-size: 18px;

            font-weight: 700;
        }


        .view-all-button {
            border: 0;

            background: transparent;

            color: #374151;

            font-size: 13px;

            font-weight: 650;

            cursor: pointer;
        }


        .complaints-list {
            width: 100%;
        }


        .empty-state {
            padding: 35px 20px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
        }


        /* =====================================
           LOADING
        ====================================== */

        .dashboard-loading {
            position: fixed;

            inset: 0;

            background:
                rgba(255, 255, 255, 0.92);

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 999;
        }


        .loading-box {
            text-align: center;
        }


        .loading-spinner {
            width: 35px;
            height: 35px;

            margin: 0 auto 12px;

            border: 3px solid #e5e7eb;

            border-top-color: #111827;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        .loading-text {
            font-size: 14px;

            color: #6b7280;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 700px) {

            .header-inner {
                min-height: 64px;

                padding: 10px 14px;
            }


            .brand-title {
                font-size: 18px;
            }


            .brand-subtitle {
                font-size: 11px;
            }


            .header-button {
                padding: 0 10px;

                font-size: 13px;
            }


            .dashboard-main {
                padding:
                    20px 14px 30px;
            }


            .welcome-title {
                font-size: 24px;
            }


            .profile-card {
                align-items: flex-start;

                flex-direction: column;
            }


            .profile-info {
                width: 100%;

                align-items: center;
            }


            .profile-media {
                width: 105px;
            }


            .profile-photo {
                width: 88px;
                height: 88px;
            }


            .edit-profile-button {
                width: 100%;
            }


            .stats-grid {
                grid-template-columns: 1fr;
            }


            .actions-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 430px) {

            .brand-logo {
                width: 39px;
                height: 39px;
            }


            .brand-title {
                font-size: 16px;
            }


            .brand-subtitle {
                display: none;
            }


            .logout-button {
                font-size: 12px;
            }


            .profile-card {
                padding: 16px;
            }


            .profile-info {
                gap: 13px;
            }


            .profile-media {
                width: 90px;
            }


            .party-logo-circle {
                width: 38px;
                height: 38px;

                margin-bottom: 7px;
            }


            .profile-photo {
                width: 78px;
                height: 78px;
            }


            .profile-name {
                font-size: 18px;
            }


            .profile-meta {
                font-size: 12px;
            }


            .stat-card {
                padding: 17px;
            }


            .stat-number {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="dashboard">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="dashboard-header">

        <div class="header-inner">

            <div class="brand">

                <img
                    src="../assets/icons/icon-192.png"
                    alt="Parshd"
                    class="brand-logo"
                >

                <div>

                    <h1 class="brand-title">
                        Parshd
                    </h1>

                    <p class="brand-subtitle">
                        Admin Dashboard
                    </p>

                </div>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    id="viewPortalButton"
                    class="header-button"
                >
                    Portal
                </button>


                <button
                    type="button"
                    id="logoutButton"
                    class="header-button logout-button"
                >
                    Logout
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="dashboard-main">


        <!-- WELCOME -->

        <section class="welcome-section">

            <h2
                id="welcomeTitle"
                class="welcome-title"
            >
                Welcome
            </h2>

            <p class="welcome-text">
                Apne ward ki profile aur citizen complaints manage karein.
            </p>

        </section>


        <!-- =====================================
             PROFILE CARD
        ====================================== -->

        <section class="profile-card">


            <div class="profile-info">


                <!-- LOGO + PHOTO -->

                <div class="profile-media">


                    <!-- PARTY LOGO -->

                    <div class="party-logo-circle">

                        <img
                            id="partyLogo"
                            src="../assets/images/default-logo.png"
                            alt="Party Logo"
                        >

                    </div>


                    <!-- PARSHAD PHOTO -->

                    <img
                        id="profilePhoto"
                        src="../assets/images/default-profile.png"
                        alt="Profile"
                        class="profile-photo"
                    >

                </div>


                <!-- DETAILS -->

                <div class="profile-details">

                    <h3
                        id="profileName"
                        class="profile-name"
                    >
                        Profile Loading...
                    </h3>


                    <p
                        id="profileMeta"
                        class="profile-meta"
                    >
                        Ward information loading...
                    </p>


                    <span
                        id="profileStatus"
                        class="profile-status"
                    >
                        Active
                    </span>

                </div>

            </div>


            <!-- EDIT -->

            <button
                type="button"
                id="editProfileButton"
                class="edit-profile-button"
            >
                Edit Profile
            </button>


        </section>


        <!-- =====================================
             COMPLAINT STATS
        ====================================== -->

        <section>

            <h2 class="section-title">
                Complaints
            </h2>


            <div class="stats-grid">


                <button
                    type="button"
                    class="stat-card"
                    data-status="new"
                >

                    <p class="stat-label">
                        New
                    </p>

                    <p
                        id="newCount"
                        class="stat-number"
                    >
                        0
                    </p>

                </button>


                <button
                    type="button"
                    class="stat-card"
                    data-status="pending"
                >

                    <p class="stat-label">
                        Pending
                    </p>

                    <p
                        id="pendingCount"
                        class="stat-number"
                    >
                        0
                    </p>

                </button>


                <button
                    type="button"
                    class="stat-card"
                    data-status="solved"
                >

                    <p class="stat-label">
                        Solved
                    </p>

                    <p
                        id="solvedCount"
                        class="stat-number"
                    >
                        0
                    </p>

                </button>

            </div>

        </section>


        <!-- =====================================
             QUICK ACTIONS
        ====================================== -->

        <section>

            <h2 class="section-title">
                Quick Actions
            </h2>


            <div class="actions-grid">


                <button
                    type="button"
                    id="complaintsButton"
                    class="action-card"
                >

                    <div class="action-icon">
                        📋
                    </div>

                    <div class="action-content">

                        <p class="action-title">
                            Complaints
                        </p>

                        <p class="action-description">
                            Citizen complaints dekhein aur manage karein.
                        </p>

                    </div>

                </button>


                <button
                    type="button"
                    id="profileActionButton"
                    class="action-card"
                >

                    <div class="action-icon">
                        👤
                    </div>

                    <div class="action-content">

                        <p class="action-title">
                            Profile
                        </p>

                        <p class="action-description">
                            Apni public profile update karein.
                        </p>

                    </div>

                </button>


                <button
                    type="button"
                    id="qrButton"
                    class="action-card"
                >

                    <div class="action-icon">
                        🔳
                    </div>

                    <div class="action-content">

                        <p class="action-title">
                            Ward QR
                        </p>

                        <p class="action-description">
                            Apne ward ka complaint QR portal dekhein.
                        </p>

                    </div>

                </button>


                <button
                    type="button"
                    id="settingsButton"
                    class="action-card"
                >

                    <div class="action-icon">
                        ⚙️
                    </div>

                    <div class="action-content">

                        <p class="action-title">
                            Complaint Settings
                        </p>

                        <p class="action-description">
                            Complaint registration ON/OFF manage karein.
                        </p>

                    </div>

                </button>

            </div>

        </section>


        <!-- =====================================
             RECENT COMPLAINTS
        ====================================== -->

        <section class="complaints-section">


            <div class="complaints-header">

                <h2 class="complaints-title">
                    Recent Complaints
                </h2>


                <button
                    type="button"
                    id="viewAllComplaintsButton"
                    class="view-all-button"
                >
                    View All
                </button>

            </div>


            <div
                id="recentComplaints"
                class="complaints-list"
            >

                <div class="empty-state">
                    Complaints loading...
                </div>

            </div>


        </section>


    </main>

</div>


<!-- =====================================
     LOADING
====================================== -->

<div
    id="dashboardLoading"
    class="dashboard-loading"
>

    <div class="loading-box">

        <div class="loading-spinner"></div>

        <div class="loading-text">
            Dashboard loading...
        </div>

    </div>

</div>


<!-- =====================================
     DASHBOARD JS
====================================== -->

<script
    type="module"
    src="./dashboard.js"
></script>


<!-- =====================================
     PARTY LOGO
====================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        try {

            const saved =
                localStorage.getItem(
                    "parshd_demo_profile"
                );


            if (!saved) {
                return;
            }


            const profile =
                JSON.parse(saved);


            const logo =
                document.getElementById(
                    "partyLogo"
                );


            if (
                logo &&
                profile.partyLogo
            ) {

                logo.src =
                    profile.partyLogo;

            }


            if (logo) {

                logo.onerror =
                    function () {

                        this.onerror =
                            null;

                        this.src =
                            "../assets/images/default-logo.png";

                    };

            }

        } catch (error) {

            console.error(
                "Party logo loading error:",
                error
            );

        }

    }
);

</script>


</body>
</html>

<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Parshd"
    >

    <title>Parshd Admin Login</title>


    <link
        rel="apple-touch-icon"
        href="../assets/icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #111827;
        }

        .admin-login-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px 16px;

            background: #ffffff;
        }

        .login-box {
            width: 100%;
            max-width: 430px;

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 30px 26px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.07);
        }

        .login-header {
            text-align: center;

            margin-bottom: 28px;
        }

        .login-logo {
            width: 72px;
            height: 72px;

            margin: 0 auto 14px;

            border-radius: 18px;

            object-fit: contain;

            display: block;
        }

        .login-title {
            margin: 0;

            font-size: 27px;

            line-height: 1.25;

            font-weight: 700;

            color: #111827;
        }

        .login-subtitle {
            margin: 8px 0 0;

            font-size: 14px;

            line-height: 1.5;

            color: #6b7280;
        }

        .login-form {
            width: 100%;
        }

        .form-group {
            width: 100%;

            margin-bottom: 18px;
        }

        .form-label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #374151;
        }

        .form-input {
            width: 100%;

            height: 50px;

            padding: 0 14px;

            border: 1px solid #d1d5db;

            border-radius: 11px;

            outline: none;

            background: #ffffff;

            color: #111827;

            font-size: 16px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-input:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 3px
                rgba(17, 24, 39, 0.08);
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .form-input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;

            right: 8px;

            top: 50%;

            transform: translateY(-50%);

            width: 40px;
            height: 40px;

            border: 0;

            border-radius: 8px;

            background: transparent;

            color: #6b7280;

            cursor: pointer;

            font-size: 18px;
        }

        .password-toggle:active {
            background: #f3f4f6;
        }

        .login-button {
            width: 100%;

            min-height: 50px;

            margin-top: 6px;

            border: 0;

            border-radius: 11px;

            background: #111827;

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .login-button:hover {
            opacity: 0.92;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .login-button:disabled {
            opacity: 0.55;

            cursor: not-allowed;
        }

        .login-message {
            display: none;

            width: 100%;

            margin-top: 16px;

            padding: 11px 12px;

            border-radius: 9px;

            font-size: 14px;

            line-height: 1.45;

            text-align: center;
        }

        .login-message.show {
            display: block;
        }

        .login-message.error {
            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;
        }

        .login-message.success {
            background: #f0fdf4;

            color: #15803d;

            border: 1px solid #bbf7d0;
        }

        .login-footer {
            margin-top: 24px;

            text-align: center;

            font-size: 12px;

            color: #9ca3af;
        }


        @media (max-width: 480px) {

            .admin-login-page {
                padding: 18px 14px;
            }

            .login-box {
                max-width: 100%;

                padding: 25px 19px;

                border-radius: 16px;
            }

            .login-title {
                font-size: 24px;
            }

            .login-logo {
                width: 64px;
                height: 64px;
            }
        }


        @media (max-height: 600px) {

            .admin-login-page {
                align-items: flex-start;

                padding-top: 25px;
            }
        }

    </style>

</head>


<body>


    <main class="admin-login-page">


        <section class="login-box">


            <header class="login-header">


                <img
                    src="../assets/icons/icon-192.png"
                    alt="Parshd"
                    class="login-logo"
                >


                <h1 class="login-title">
                    Parshd Admin
                </h1>


                <p class="login-subtitle">
                    Parshad / Administrator Login
                </p>


            </header>



            <form
                id="loginForm"
                class="login-form"
                autocomplete="on"
            >


                <div class="form-group">


                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >


                </div>



                <div class="form-group">


                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>


                    <div class="password-wrap">


                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>


                    </div>


                </div>



                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>



                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                ></div>


            </form>



            <footer class="login-footer">
                Parshd Platform
            </footer>


        </section>


    </main>



    <!--
        IMPORTANT:
        Login ka pura Firebase logic
        admin/login.js handle karega.
    -->
    <script>
    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    togglePassword.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type === "password";

            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";

            togglePassword.textContent =
                isPassword
                    ? "🙈"
                    : "👁";

            togglePassword.setAttribute(
                "aria-label",
                isPassword
                    ? "Hide password"
                    : "Show password"
            );

        }
    );
        
</script>

    <script
        type="module"
        src="./login.js"
    ></script>


</body>

</html>
